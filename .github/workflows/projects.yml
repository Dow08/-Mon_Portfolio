name: Projets

# Régénère data/projects.json depuis les dépôts publics (voir scripts/build_projects.py).
# Déclenché chaque jour, à la main, ou depuis un autre dépôt via repository_dispatch
# (type "update-projects"). Échoue si une carte de référence manque ou si un lien ne répond pas.

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [update-projects]

permissions: {}

concurrency:
  group: projects
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Génération (avec vérification des liens)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_projects.py --check

      - name: Validation
        run: python scripts/validate_data.py projects

      - name: Commit si changement
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          # generated_at change à chaque exécution : on ne commite que si les projets changent
          if git diff --staged -I '"generated_at"' --quiet; then
            echo "Aucun changement de projet"
          else
            git commit -m "Projets : mise à jour automatique"
            git push
          fi
